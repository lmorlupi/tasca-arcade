<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pocket Color">
<meta name="theme-color" content="#1c1c1c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="shell.css">
<title>Pocket Color</title>
</head>
<body data-shell="grape">
<main class="gbc">
  <div class="bezel">
    <div class="topline">
      <i class="led" aria-hidden="true"></i>
      <span class="label">DOT MATRIX WITH STEREO SOUND</span>
      <button class="home" id="home" aria-label="Torna al catalogo">⌂</button>
    </div>
    <div class="screen" id="screen">
      <canvas id="cv" width="480" height="576"></canvas>
      <section class="menu" id="menu" aria-label="Catalogo giochi"></section>
      <section class="boot" id="boot" aria-hidden="true">
        <div class="logo" id="logo"></div>
        <p>TOCCA PER INIZIARE</p>
      </section>
    </div>
  </div>
  <div class="brand" id="brand">POCKET <b>COLOR</b></div>
  <div class="pad">
    <div class="dpad" id="dpad">
      <div class="cross">
        <button class="up" data-dir="up" aria-label="Su">▲</button>
        <button class="left" data-dir="left" aria-label="Sinistra">◀</button>
        <div class="mid"></div>
        <button class="right" data-dir="right" aria-label="Destra">▶</button>
        <button class="down" data-dir="down" aria-label="Giù">▼</button>
      </div>
    </div>
    <div class="ab">
      <button class="b" data-k="b" aria-label="B">B</button>
      <button class="a" data-k="a" aria-label="A">A</button>
    </div>
  </div>
  <div class="meta">
    <button data-k="select" aria-label="Select"><span>SELECT</span></button>
    <button data-k="start" aria-label="Start"><span>START</span></button>
  </div>
</main>
<!-- Su iPhone un interruttore nascosto, toccato da script, dà la vibrazione. -->
<label class="hap" id="hapLabel" aria-hidden="true"><input type="checkbox" switch tabindex="-1"></label>

<script src="shell.js"></script>
<script src="games/blocks.js"></script>
<script src="games/barrel-climb.js"></script>
<script src="games/mouse-quest.js"></script>
<script src="games/tilt-ball.js"></script>
<script src="games/flick-hoops.js"></script>
<script src="games/slide-2048.js"></script>
<script src="games/space-raiders.js"></script>
<script src="games/galaxy-strike.js"></script>
<script>
  Shell.start();
  // Offline: il service worker salva tutti i file al primo caricamento (serve https o localhost).
  if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
</body>
</html>
